services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    # Runtime env (LLM_API_KEY, LLM_MODEL, ASSISTANT_MODE, ...) injected here,
    # never baked into the image. Reuses the file you already filled in.
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: 0.0.0.0
    expose:
      - "3001"          # internal only — nginx is the public entrypoint
    restart: unless-stopped
    networks:
      - app

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
    restart: unless-stopped
    networks:
      - app

  # One-shot TLS certificate issuance / renewal. Not started by `up`
  # (profile-gated) — run explicitly, see nginx/default.conf header notes.
  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot

networks:
  app:
    driver: bridge

volumes:
  certbot-etc:
  certbot-www:
