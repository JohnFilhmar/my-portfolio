services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    # Runtime env (LLM_API_KEY, LLM_MODEL, ASSISTANT_MODE, SMTP_*, ...) injected
    # here, never baked into the image.
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: 0.0.0.0
    # Publish on loopback only. The box already runs a host nginx (it serves the
    # other apps) — it reverse-proxies filhmar.online to 127.0.0.1:3001. Binding
    # to 127.0.0.1 keeps this off the public interface; nginx is the only entry.
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
