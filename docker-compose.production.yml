# Production on the server, run by deploy/deploy.sh from the pipeline.
#
# IMAGE is the signed image, pinned by digest. ENV_FILE is the production env
# file deploy.sh decrypts from deploy/env/production.env.enc for the length of
# the deploy. Neither is ever set by hand in this file.
#
# Published on loopback only: the host nginx reverse-proxies filhmar.online to
# 127.0.0.1:3001 and is the only way in.
name: portfolio

services:
  web:
    image: ${IMAGE:?set IMAGE to the signed image digest}
    env_file:
      - ${ENV_FILE:?set ENV_FILE to the decrypted production env file}
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
