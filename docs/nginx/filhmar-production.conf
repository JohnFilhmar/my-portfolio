# Reference nginx site for filhmar.online.
#
# The box already runs a host nginx serving other apps (e.g. jms-e-talyer). This
# site is ADDED to it — do not remove the other enabled sites. The portfolio's
# Next.js container is published on 127.0.0.1:3001 (see docker-compose.yml), so
# nothing reaches it except through this reverse proxy on the same host.
#
# This file is deliberately HTTP-only. `certbot --nginx` rewrites it in place:
# it adds `listen 443 ssl`, the ssl_certificate lines, and turns the port-80
# block into an HTTPS redirect — reusing the location blocks below, so routing
# is preserved.
#
# Shipping a 443 block up front does not work: nginx refuses to load a
# `listen ... ssl` server that has no certificate, and certbot --nginx cannot
# modify a config that will not load. They deadlock before the first cert issues.
#
# Usage (on the box):
#   sudo cp docs/nginx/filhmar-production.conf /etc/nginx/sites-available/filhmar
#   sudo ln -sf /etc/nginx/sites-available/filhmar /etc/nginx/sites-enabled/filhmar
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d filhmar.online -d www.filhmar.online
#
# Renewal is automatic via certbot's systemd timer (installed with the certbot
# package) — the acme-challenge location below keeps working after the redirect
# is added, so renewals succeed unattended.

upstream filhmar_web {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    listen [::]:80;
    server_name filhmar.online www.filhmar.online;

    # The AI assistant and contact API post small JSON bodies; 10m is generous
    # headroom and matches the other sites on this box.
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # X-Forwarded-For feeds the app's per-IP rate limiter (assistant + contact);
    # X-Forwarded-Proto tells it the original request was HTTPS.
    proxy_set_header X-Forwarded-Proto $scheme;
    # No WebSockets on this site, so Upgrade is never forwarded (that closes
    # h2c smuggling past the proxy). An empty Connection keeps upstream
    # keepalive working.
    proxy_set_header Connection        "";

    # Let the ACME http-01 challenge through untouched — first issuance and every
    # renewal after certbot adds the HTTPS redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Long-cache immutable Next.js build assets.
    location /_next/static/ {
        proxy_pass http://filhmar_web;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else is the Next.js app.
    location / {
        proxy_pass http://filhmar_web;
    }
}
