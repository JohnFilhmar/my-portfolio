# Staging on the same server: the exact image production will get, checked
# by the pipeline (health, smoke test, ZAP baseline) and then stopped.
#
# No secrets: the assistant runs in demo mode, so staging never spends model
# tokens, and the contact form falls back to mailto. Loopback only, on 3101.
name: portfolio-staging

services:
  web:
    image: ${IMAGE:?set IMAGE to the signed image digest}
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: 0.0.0.0
      ASSISTANT_MODE: demo
    ports:
      - "127.0.0.1:3101:3001"
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
