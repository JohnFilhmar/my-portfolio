# =============================================================================
# nginx reverse proxy for filhmar.online  ->  Next.js container (web:3001)
#
# HTTP-only out of the box so `docker compose up` works before you have certs.
# To enable HTTPS:
#   1. Point filhmar.online + www DNS A/AAAA records at this server.
#   2. Bring the stack up (this file, port 80 reachable):
#        docker compose up -d --build
#   3. Issue the certificate (webroot challenge served from /var/www/certbot):
#        docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
#          -d filhmar.online -d www.filhmar.online \
#          --email olajohnfilhmar@gmail.com --agree-tos --no-eff-email
#   4. Uncomment the HTTPS server block below AND the redirect line in the
#      port-80 block, then reload:
#        docker compose exec nginx nginx -s reload
#   5. Renew (cron / scheduled task, e.g. weekly):
#        docker compose run --rm certbot renew && \
#          docker compose exec nginx nginx -s reload
# =============================================================================

upstream nextjs_upstream {
    server web:3001;
    keepalive 32;
}

# ----------------------------- HTTP (port 80) --------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name filhmar.online www.filhmar.online;

    # Let's Encrypt HTTP-01 challenge — keep this above any redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # After certs are issued, force HTTPS: uncomment the redirect block below
    # AND comment out the two proxy locations further down (the HTTPS server
    # serves them). Keep the acme-challenge location above — renewals need it.
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff2;
    client_max_body_size 10m;

    # Long-cache immutable build assets.
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # No WebSockets on this site, so Upgrade is never forwarded (that closes
        # h2c smuggling past the proxy). An empty Connection keeps upstream
        # keepalive working.
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}

