# Each ecosystem waits a week before proposing a release (cooldown), so a
# hijacked or broken version is usually caught by others first.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Next 16.4 inlines Turbopack's bootstrap script, which the hash-only
      # script-src CSP blocks, so the site never hydrates. Held at 16.3.8
      # until the CSP moves to a per-request nonce.
      - dependency-name: next
        versions: [">=16.4.0"]
      # typescript-eslint supports TypeScript below 6.1 only.
      - dependency-name: typescript
        versions: [">=6.1.0"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Node majors alternate between LTS and short-lived releases; moving to
    # the next LTS is a deliberate change, so only digest and patch bumps here.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
