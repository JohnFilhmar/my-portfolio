# Every PR and every push to master runs the checks and scans. A push to
# master then builds, scans and signs the image, deploys it to staging on the
# server automatically, and waits for a manual approval before production
# gets the exact same digest.
#
# Third-party actions and images are pinned by commit SHA or digest;
# Dependabot proposes the bumps.
name: pipeline

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  SEMGREP_IMAGE: semgrep/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRIVY_IMAGE: aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Refuse committed sample content
        run: |
          if compgen -G "config/notes/sample-*.json" >/dev/null ||
             grep -q '"id": "sample-' config/sections/certifications.json; then
            echo "::error::Sample content from npm run sample:seed is committed. Run npm run sample:clean, then commit again."
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks from its own image, pinned by digest: scans every commit,
      # needs no GitHub API access, and prints no secret values.
      - name: gitleaks (full history)
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE"
          git /repo --redact --no-banner --exit-code 1

  sast:
    name: Code scan (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep
        run: >
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE"
          semgrep scan --error --metrics off
          --config p/default --config p/typescript --config p/react --config p/nextjs

  deps:
    name: Dependency scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Trivy from its own image, pinned by digest: no third-party action.
      - name: Trivy (lockfile and config)
        run: >
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE"
          fs --scanners vuln,misconfig --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 .

  image:
    name: Build, scan and sign the image
    needs: [checks, secrets, sast, deps]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # SBOM and SLSA provenance travel with the image as attestations.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: ref
        run: echo "ref=${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}" >>"$GITHUB_OUTPUT"
      - name: Scan the pushed image (Trivy)
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: >
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD "$TRIVY_IMAGE"
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          "${{ steps.ref.outputs.ref }}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Signed only after the scan passes; the deploy refuses unsigned images.
      - name: Sign the scanned digest
        run: cosign sign --yes "${{ steps.ref.outputs.ref }}"

  staging:
    name: Staging (automatic)
    needs: image
    runs-on: [self-hosted, linux, portfolio]
    environment: staging
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.image.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to GHCR
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: deploy/deploy.sh staging "$IMAGE"
      - run: deploy/smoke.sh http://127.0.0.1:3101
      - name: Live scan (ZAP baseline)
        run: |
          mkdir -p zap && chmod 777 zap && cp deploy/zap-rules.tsv zap/
          docker run --rm --network host -v "$PWD/zap:/zap/wrk" "$ZAP_IMAGE" \
            zap-baseline.py -t http://127.0.0.1:3101 -c zap-rules.tsv \
            -r zap-report.html -J zap-report.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: zap/zap-report.*
          if-no-files-found: ignore
      - name: Stop staging
        if: always()
        run: docker compose -p portfolio-staging -f docker-compose.staging.yml down
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  production:
    name: Production (approval required)
    needs: [image, staging]
    runs-on: [self-hosted, linux, portfolio]
    environment:
      name: production
      url: https://filhmar.online
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.image.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to GHCR
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: deploy/deploy.sh production "$IMAGE"
      - name: Smoke test the public site
        run: deploy/smoke.sh https://filhmar.online
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
